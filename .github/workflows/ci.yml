name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: "${{ matrix.compiler }} / ${{ matrix.preset }}"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc-13, clang-17]
        preset: [ci, ci-asan]
    steps:
      - uses: actions/checkout@v4

      - name: Install GCC 13
        if: matrix.compiler == 'gcc-13'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-13 g++-13
          echo "CC=gcc-13"  >> "$GITHUB_ENV"
          echo "CXX=g++-13" >> "$GITHUB_ENV"

      - name: Install Clang 17
        if: matrix.compiler == 'clang-17'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-17
          echo "CC=clang-17"    >> "$GITHUB_ENV"
          echo "CXX=clang++-17" >> "$GITHUB_ENV"

      - name: Install Ninja
        run: sudo apt-get install -y ninja-build

      - name: Cache CMake deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-${{ matrix.compiler }}-deps-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format-17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-format-17
      - name: Check formatting
        run: |
          find include src tests -name '*.hpp' -o -name '*.cpp' \
            | xargs clang-format-17 --dry-run --Werror

  tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-17 clang-tidy-17 ninja-build
      - name: Configure (ci preset)
        env:
          CC: clang-17
          CXX: clang++-17
        run: cmake --preset ci
      - name: Build (to generate compile_commands.json)
        env:
          CC: clang-17
          CXX: clang++-17
        run: cmake --build --preset ci
      - name: Run clang-tidy
        run: |
          find include src -name '*.hpp' -o -name '*.cpp' \
            | xargs clang-tidy-17 -p build/ci

  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-13 g++-13 ninja-build lcov
      - name: Configure
        env:
          CC: gcc-13
          CXX: g++-13
        run: cmake --preset coverage
      - name: Build
        run: cmake --build --preset coverage
      - name: Test
        run: ctest --preset coverage
      - name: Collect coverage
        run: |
          lcov --capture --directory build/coverage \
               --output-file coverage.info \
               --gcov-tool gcov-13
          lcov --remove coverage.info \
               '*/build/_deps/*' '/usr/*' \
               --output-file coverage.filtered.info
      - name: Enforce 80% line coverage
        run: |
          pct=$(lcov --summary coverage.filtered.info 2>&1 \
                | grep 'lines' | grep -oP '[0-9]+\.[0-9]+(?=%)' | head -1)
          echo "Line coverage: ${pct}%"
          awk -v p="$pct" 'BEGIN { if (p+0 < 80) { print "Coverage " p "% below 80% threshold"; exit 1 } }'
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.filtered.info
